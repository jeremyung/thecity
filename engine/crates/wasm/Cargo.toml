[package]
name = "city-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen bindings for the engine: the worker's only entry point"

[lib]
crate-type = ["cdylib"]

[features]
profiling = ["tokyo-city-engine/profiling"]
legacy = ["tokyo-city-engine/legacy"]
single-expressway-candidate = ["tokyo-city-engine/single-expressway-candidate"]
compact-expressway-candidate = ["tokyo-city-engine/compact-expressway-candidate"]
street-placement-candidate = ["tokyo-city-engine/street-placement-candidate"]
frontage-fit-candidate = ["tokyo-city-engine/frontage-fit-candidate"]
flag-passage-candidate = ["tokyo-city-engine/flag-passage-candidate"]
block-proportion-candidate = ["tokyo-city-engine/block-proportion-candidate"]
parent-passage-candidate = ["tokyo-city-engine/parent-passage-candidate"]
frontage-network-candidate = ["tokyo-city-engine/frontage-network-candidate"]

[dependencies]
tokyo-city-engine = { path = "../.." }
serde_json = "1"
wasm-bindgen = "=0.2.108"
